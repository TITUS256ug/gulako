name: Gulako release checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:discovery
      - run: npm run test:growth
      - run: npm run test:billing
      - run: npm run test:checkout
      - run: npm run test:clipboard
